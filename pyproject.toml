[project]
name = "resilienttech"
version = "0.1.0"
description = "Inventory management system for resilient technologies web test"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.1",
    "django-cors-headers>=4.7.0",
    "django-environ==0.12.0",
    "djangorestframework==3.16.0",
    "drf-yasg==1.21.10",
    "pre-commit==4.2.0",
    "psycopg2==2.9.10",
    "ruff==0.11.11",
]

[tool.ruff]
line-length = 120
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ['E', 'F', 'I']
fixable = ['ALL']

[tool.ruff.format]
quote-style = 'single'
